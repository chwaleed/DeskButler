[project]
name = "agent"
version = "0.1.0"
description = "Local desktop AI agent backend"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.11",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pywebview>=6.2.1",
    "send2trash>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
